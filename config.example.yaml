# project_class/config.example.yaml
# 复制此文件为 config.yaml 并填写你的配置。
# API Key 建议放在 .env 文件中（AGENT_API_KEY=xxx），避免提交到版本库。

llm:
  provider: deepseek                      # 支持: deepseek | openai | custom
  api_key: ""                             # 留空则从 AGENT_API_KEY 环境变量读取
  base_url: "https://api.deepseek.com/v1" # DeepSeek 兼容 OpenAI 接口
  model: "deepseek-chat"
  temperature: 0.7
  timeout: 60
  max_retries: 3
  streaming: true                         # 启用流式输出

agent:
  max_iterations: 20                      # 单次 loop 最大工具调用轮数
  work_dir: "."                           # 工作目录（相对于 project_class/）
  system_prompt: |
    你是一个智能助手，可以使用工具帮助用户完成任务。
    工作目录为 {work_dir}。
    在使用工具时，请逐步思考并说明你的操作意图。

session:
  dir: ".sessions"                        # Session 文件存储目录
  max_history: 100                        # 单 Session 最多保留消息轮数
  auto_save: true                         # 每轮对话后自动保存

tools:
  enabled:                                # 启用的工具，注释掉即可禁用
    - skill_read
    - read_file
    - write_file
    - list_dir
    - change_dir
    - shell
    - search_files

skills:
  enabled: true                           # 启用 AgentSkills 风格的 Skill
  dirs:
    - "skills"                            # 相对于 project_class/ 的 Skill 根目录
  max_file_bytes: 262144                  # 单个 SKILL.md 最大读取字节数
  max_prompt_items: 50                    # 注入上下文的 Skill 摘要数量上限
  max_description_chars: 240              # 单个 description 最大长度
